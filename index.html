<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- 🌈 Internal CSS Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d0f0ff, #a8e0ff);
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            background-color: #0077b6;
            color: white;
            padding: 15px;
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #0077b6;
            border-bottom: 2px solid #0077b6;
            padding-bottom: 5px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #005f8a;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 15px;
        }

        th {
            background-color: #0077b6;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f9ff;
        }

        tr:hover {
            background-color: #d6f0ff;
        }

        .footer {
            text-align: center;
            color: #555;
            margin-top: 25px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🎓 Student Management System</h1>

    <div class="container">
        <h2>Add Student</h2>
        <form id="studentForm">
            <label>Student Name:</label>
            <input type="text" id="name" placeholder="Enter student name" required>

            <label>Roll Number:</label>
            <input type="text" id="roll" placeholder="Enter roll number" required>

            <label>Course:</label>
            <select id="course" required>
                <option value="">Select course</option>
                <option value="MCA">MCA</option>
                <option value="BCA">BCA</option>
                <option value="MBA">MBA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
            </select>

            <button type="button" onclick="addStudent()">Add Student</button>
        </form>

        <h2>Student List</h2>
        <table id="studentTable">
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Course</th>
            </tr>
        </table>
    </div>

    <div class="footer">
        © 2025 Student Management System | Designed with 💙 by ChatGPT
    </div>

    <!-- 💻 JavaScript Functionality -->
    <script>
        function addStudent() {
            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let course = document.getElementById("course").value;

            if (name && roll && course) {
                let table = document.getElementById("studentTable");
                let row = table.insertRow();
                row.insertCell(0).innerHTML = roll;
                row.insertCell(1).innerHTML = name;
                row.insertCell(2).innerHTML = course;

                document.getElementById("studentForm").reset();
            } else {
                alert("⚠️ Please fill all fields before adding a student!");
            }
        }
    </script>

</body>
</html>
